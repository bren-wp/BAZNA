name: SIDRENA responsive Android emulator screenshots

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-responsive-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewport-smoke:
    name: Test 12 screens at phone, tablet and landscape viewport sizes
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Emulator and real Compose screenshot smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: android
          script: |
            set -euo pipefail
            for entry in \
              '240x432:compact:1.0' \
              '320x568:small:1.0' \
              '360x640:phone:1.0' \
              '393x852:reference:1.0' \
              '393x852:large-font:1.4' \
              '600x960:tablet:1.0' \
              '840x540:landscape:1.0'; do
              IFS=: read -r pixels label font <<< "$entry"
              adb shell wm size "$pixels"
              adb shell wm density 160
              adb shell settings put system font_scale "$font"
              adb shell am force-stop com.brendigo.sidrena || true
              gradle --no-daemon --console=plain :app:connectedDebugAndroidTest \
                -Pandroid.testInstrumentationRunnerArguments.class=com.brendigo.sidrena.ui.ResponsiveScreensTest
              mkdir -p "../artifacts/responsive/$label"
              adb pull /sdcard/Android/data/com.brendigo.sidrena/files/ui-screenshots/ \
                "../artifacts/responsive/$label/"
            done
            adb shell wm size reset
            adb shell wm density reset
      - name: Upload unmodified emulator captures for visual comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIDRENA-Android-responsive-emulator-captures
          path: artifacts/responsive/
          if-no-files-found: warn
          retention-days: 14
