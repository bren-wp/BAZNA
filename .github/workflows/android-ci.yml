name: BAZNA Android build, tests and audited artifacts

on:
  pull_request:
    paths:
      - 'android/**'
      - 'tools/audit_android.py'
      - 'tools/run_android_responsive.sh'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the latest PR revision under test; 9 emulator profiles take
# substantial runner time and stale commits must not block current QA.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Kotlin compile, tests, lint, APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37.0 from hosted runner command-line tools
        shell: bash
        run: |
          set -euo pipefail
          manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$manager"
          yes | "$manager" --licenses >/dev/null || true
          "$manager" --install "platforms;android-37.0" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-37.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Android source/dead-code and security scan
        run: |
          python3 ../tools/audit_android.py
          python3 ../tools/check_android_play_readiness.py
      - name: Unit tests, lint, installable debug APK, release AAB
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease
      - name: Verify generated app identity and release version
        run: |
          set -euo pipefail
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$aapt"
          package_line=$("$aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 1)
          echo "$package_line"
          [[ "$package_line" == *"name='com.brendigo.bazna'"* ]]
          [[ "$package_line" == *"versionCode='23'"* ]]
          [[ "$package_line" == *"versionName='1.5.20'"* ]]
      - name: Verify built artifacts and hash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          mkdir -p ../artifacts/android
          cp app/build/outputs/apk/debug/app-debug.apk ../artifacts/android/BAZNA-Android-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab ../artifacts/android/BAZNA-Android-unsigned.aab
          cd ../artifacts/android
          sha256sum BAZNA-Android-debug.apk BAZNA-Android-unsigned.aab > BAZNA-Android-SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: BAZNA-Android-unsigned-build
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 30

  responsive-emulator:
    name: Android 12 screens × 9 real emulator configurations
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Android emulator KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android SDK 37.0 for app compilation
        shell: bash
        run: |
          set -euo pipefail
          manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          yes | "$manager" --licenses >/dev/null || true
          "$manager" --install "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Build real device instrumentation APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Exercise all twelve Compose screens and capture per-size screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/run_android_responsive.sh
      - name: Publish actual screen captures and instrumentation output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BAZNA-Android-responsive-screenshots
          path: artifacts/android-responsive/
          if-no-files-found: warn
          retention-days: 7
