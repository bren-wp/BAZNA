name: SIDRENA Android build, tests and audited artifacts

on:
  pull_request:
    paths:
      - 'android/**'
      - 'tools/audit_android.py'
      - 'tools/run_android_responsive.sh'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android Kotlin compile, tests, lint, APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36 from hosted runner command-line tools
        shell: bash
        run: |
          set -euo pipefail
          manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -x "$manager"
          yes | "$manager" --licenses >/dev/null || true
          "$manager" --install "platforms;android-36" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android source/dead-code and security scan
        run: python3 ../tools/audit_android.py
      - name: Unit tests, lint, installable debug APK, release AAB
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease
      - name: Verify built artifacts and hash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          mkdir -p ../artifacts/android
          cp app/build/outputs/apk/debug/app-debug.apk ../artifacts/android/SIDRENA-Android-debug.apk
          cp app/build/outputs/bundle/release/app-release.aab ../artifacts/android/SIDRENA-Android-unsigned.aab
          cd ../artifacts/android
          sha256sum SIDRENA-Android-debug.apk SIDRENA-Android-unsigned.aab > SIDRENA-Android-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SIDRENA-Android-unsigned-build
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 30

  responsive-emulator:
    name: Android 12 screens × 9 real emulator configurations
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable Android emulator KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android SDK 36 for app compilation
        shell: bash
        run: |
          set -euo pipefail
          manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          yes | "$manager" --licenses >/dev/null || true
          "$manager" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build real device instrumentation APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Exercise all twelve Compose screens and capture per-size screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/run_android_responsive.sh
      - name: Publish actual screen captures and instrumentation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIDRENA-Android-responsive-screenshots
          path: artifacts/android-responsive/
          if-no-files-found: warn
          retention-days: 7
