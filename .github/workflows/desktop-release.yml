# Build a new cross-platform BAZNA release from verified same-commit CI artifacts.
# WordPress version changes only with source changes; preserve the original 1.5.0 release.
name: Publish BAZNA Android Windows and WordPress package

on:
  workflow_run:
    workflows: ["BAZNA Android build, tests and audited artifacts"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: bazna-cross-platform-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CI_SHA: ${{ github.event.workflow_run.head_sha }}
      ANDROID_RUN_ID: ${{ github.event.workflow_run.id }}
      RELEASE_VERSION: '1.5.16'
      WEB_JOOMLA_SHOPIFY_VERSION: '1.1.2'
      ANDROID_VERSION: '1.5.16'
      WINDOWS_VERSION: '0.10.6'
      WORDPRESS_VERSION: '1.5.16'
      ORIGINAL_PLUGIN_SHA: '58e9b44b8054ef0076a329aa7a8a3ec663947d33bfa375c4203bc109925409f8'
    steps:
      - name: Verify target commit and original WordPress release
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          [[ "$current" == "$CI_SHA" ]] || { echo "Main has moved, skip obsolete release"; exit 1; }
          gh release view 1.5.0 --repo "$GH_REPO" >/dev/null
          original=$(gh api "repos/$GH_REPO/releases/tags/1.5.0" --jq '.assets[] | select(.name=="brendigo-sidrena-cijena-1.5.0.zip") | .digest')
          [[ "$original" == "sha256:$ORIGINAL_PLUGIN_SHA" ]] || { echo "Original 1.5.0 asset digest changed"; exit 1; }
          tag="$RELEASE_VERSION"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            echo "ALREADY_EXISTS=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.ALREADY_EXISTS != '1'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Wait for matching Windows tests and package
        if: env.ALREADY_EXISTS != '1'
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/$GH_REPO/actions/workflows/desktop-ci.yml/runs?head_sha=$CI_SHA&per_page=30"
          for attempt in $(seq 1 90); do
            result=$(gh api "$endpoint" --jq '.workflow_runs | map(select(.event=="push" and .head_branch=="main")) | sort_by(.created_at) | last | [.id, .status, (.conclusion // "pending")] | @tsv' || true)
            if [[ -n "$result" && "$result" != "null" ]]; then
              read -r win_run win_status win_result <<< "$result"
              if [[ "$win_status" == "completed" ]]; then
                [[ "$win_result" == "success" ]] || { echo "Windows tests: $win_result"; exit 1; }
                echo "WIN_RUN_ID=$win_run" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            sleep 30
          done
          echo "Timed out waiting for Windows CI of $CI_SHA"
          exit 1
      - name: Require matching successful WordPress and security audits
        if: env.ALREADY_EXISTS != '1'
        shell: bash
        run: |
          set -euo pipefail
          for workflow in official-plugin-ci.yml repository-audit.yml multiplatform-ci.yml; do
            endpoint="repos/$GH_REPO/actions/workflows/$workflow/runs?head_sha=$CI_SHA&per_page=20"
            found=0
            for attempt in $(seq 1 90); do
              result=$(gh api "$endpoint" --jq '.workflow_runs | map(select(.event=="push" and .head_branch=="main")) | sort_by(.created_at) | last | [.status, (.conclusion // "pending")] | @tsv' || true)
              if [[ -n "$result" && "$result" != "null" ]]; then
                read -r status conclusion <<< "$result"
                if [[ "$status" == "completed" ]]; then
                  [[ "$conclusion" == "success" ]] || { echo "$workflow failed: $conclusion"; exit 1; }
                  found=1
                  break
                fi
              fi
              sleep 10
            done
            [[ "$found" -eq 1 ]] || { echo "Missing successful $workflow for $CI_SHA"; exit 1; }
          done
      - name: Download actual Android and Windows binaries
        if: env.ALREADY_EXISTS != '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$ANDROID_RUN_ID" --repo "$GH_REPO" \
            --name 'BAZNA-Android-unsigned-build' --dir release
          gh run download "$WIN_RUN_ID" --repo "$GH_REPO" \
            --name 'SIDRENA-Desktop-release-binaries' --dir release
          # New WordPress ZIP is packaged from this exact release commit.
      - name: Download verified BAZNA Web, Joomla and Shopify artifacts
        if: env.ALREADY_EXISTS != '1'
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/$GH_REPO/actions/workflows/multiplatform-ci.yml/runs?head_sha=$CI_SHA&per_page=30"
          platform_run=$(gh api "$endpoint" --jq '.workflow_runs | map(select(.event=="push" and .head_branch=="main" and .status=="completed" and .conclusion=="success")) | sort_by(.created_at) | last | .id')
          [[ "$platform_run" =~ ^[0-9]+$ ]] || { echo "Verified Web/Joomla/Shopify workflow missing"; exit 1; }
          gh run download "$platform_run" --repo "$GH_REPO" \
            --name 'BAZNA-web-joomla-shopify-candidate' --dir release
          for name in \
            "BAZNA-Web-$WEB_JOOMLA_SHOPIFY_VERSION.zip" \
            "BAZNA-Joomla-Plugin-$WEB_JOOMLA_SHOPIFY_VERSION.zip" \
            "BAZNA-Shopify-Adapter-$WEB_JOOMLA_SHOPIFY_VERSION.zip"; do
            test -s "release/$name" && test -s "release/$name.sha256"
            (cd release && sha256sum -c "$name.sha256")
          done
      - name: Package WordPress from verified source
        if: env.ALREADY_EXISTS != '1'
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/brendigo-sidrena-cijena -name '*.php' -type f -print0 |
            xargs -0 -n 1 php -l > /tmp/sidrena-lint.log
          php tools/test_legal_contract.php
          python3 tools/audit_repository.py
          python3 tools/package_plugin.py --version "$WORDPRESS_VERSION" --output "release/BAZNA-WordPress-$WORDPRESS_VERSION.zip"
          (cd release && sha256sum -c "BAZNA-WordPress-$WORDPRESS_VERSION.zip.sha256")
          # Public source only; the previously issued 10000 keys require the
          # separate private config.php bundled directly with the customer.
          php licenca/tests/test.php
          python3 tools/package_license.py --version "$RELEASE_VERSION" --output "release/BAZNA-Licenca-Server-$RELEASE_VERSION.zip"
          (cd release && sha256sum -c "BAZNA-Licenca-Server-$RELEASE_VERSION.zip.sha256")
          for name in \
            "BAZNA-Web-$WEB_JOOMLA_SHOPIFY_VERSION.zip" \
            "BAZNA-Joomla-Plugin-$WEB_JOOMLA_SHOPIFY_VERSION.zip" \
            "BAZNA-Shopify-Adapter-$WEB_JOOMLA_SHOPIFY_VERSION.zip"; do
            (cd release && sha256sum -c "$name.sha256")
          done
      - name: Verify all platforms and SHA-256 hashes
        if: env.ALREADY_EXISTS != '1'
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            BAZNA-Android-debug.apk BAZNA-Android-unsigned.aab \
            BAZNA-Android-SHA256SUMS.txt \
            SIDRENA-Desktop-win-x64-Portable.exe SIDRENA-Desktop-win-x64-Setup.exe \
            SIDRENA-Desktop-win-x64-SHA256SUMS.txt SIDRENA-Desktop-release-info.json \
            BAZNA-WordPress-$WORDPRESS_VERSION.zip BAZNA-WordPress-$WORDPRESS_VERSION.zip.sha256 \
            BAZNA-Licenca-Server-$RELEASE_VERSION.zip BAZNA-Licenca-Server-$RELEASE_VERSION.zip.sha256 \
            BAZNA-Web-$WEB_JOOMLA_SHOPIFY_VERSION.zip BAZNA-Web-$WEB_JOOMLA_SHOPIFY_VERSION.zip.sha256 \
            BAZNA-Joomla-Plugin-$WEB_JOOMLA_SHOPIFY_VERSION.zip BAZNA-Joomla-Plugin-$WEB_JOOMLA_SHOPIFY_VERSION.zip.sha256 \
            BAZNA-Shopify-Adapter-$WEB_JOOMLA_SHOPIFY_VERSION.zip BAZNA-Shopify-Adapter-$WEB_JOOMLA_SHOPIFY_VERSION.zip.sha256; do
            test -s "release/$file" || { echo "Missing release/$file"; exit 1; }
          done
          (cd release && sha256sum -c BAZNA-Android-SHA256SUMS.txt)
          (cd release && sha256sum -c SIDRENA-Desktop-win-x64-SHA256SUMS.txt)
          (cd release && sha256sum -c "BAZNA-WordPress-$WORDPRESS_VERSION.zip.sha256")
          (cd release && sha256sum -c "BAZNA-Licenca-Server-$RELEASE_VERSION.zip.sha256")
          src_sha=$(python3 -c 'import json;print(json.load(open("release/SIDRENA-Desktop-release-info.json"))["source_commit"])')
          [[ "$src_sha" == "$CI_SHA" ]] || { echo "Windows provenance mismatch"; exit 1; }
          win_version=$(python3 -c 'import json;print(json.load(open("release/SIDRENA-Desktop-release-info.json"))["desktop_version"])')
          [[ "$win_version" == "$WINDOWS_VERSION" ]] || { echo "Windows version mismatch"; exit 1; }
          wp_version=$(python3 -c 'import json;print(json.load(open("release/SIDRENA-Desktop-release-info.json"))["wordpress_plugin_version"])')
          [[ "$wp_version" == "$WORDPRESS_VERSION" ]] || { echo "WordPress version mismatch"; exit 1; }
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          [[ "$current" == "$CI_SHA" ]] || { echo "Main changed during verification"; exit 1; }
      - name: Publish user-facing BAZNA filenames for verified Windows binaries
        if: env.ALREADY_EXISTS != '1'
        shell: bash
        run: |
          set -euo pipefail
          # CI provenance and original SHA-256s were checked in the previous step.
          # Rename only the delivery artifacts; never alter executable bytes.
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          folder = Path("release")
          filenames = {
              "SIDRENA-Desktop-win-x64-Portable.exe": "BAZNA-Desktop-win-x64-Portable.exe",
              "SIDRENA-Desktop-win-x64-Setup.exe": "BAZNA-Desktop-win-x64-Setup.exe",
          }
          for old, new in filenames.items():
              original, branded = folder / old, folder / new
              assert original.is_file() and original.stat().st_size > 100_000
              assert not branded.exists(), new
              original.rename(branded)
          checks = [
              f"{hashlib.sha256((folder / name).read_bytes()).hexdigest()}  {name}"
              for name in filenames.values()
          ]
          (folder / "SIDRENA-Desktop-win-x64-SHA256SUMS.txt").unlink()
          (folder / "BAZNA-Desktop-win-x64-SHA256SUMS.txt").write_text(
              "\n".join(checks) + "\n", encoding="utf-8"
          )
          old_manifest = folder / "SIDRENA-Desktop-release-info.json"
          info = json.loads(old_manifest.read_text(encoding="utf-8-sig"))
          assert info["source_commit"] and info["desktop_version"]
          info["product"] = "BAZNA Desktop"
          info["files"] = json.loads(
              json.dumps(info.get("files", []), ensure_ascii=False)
              .replace("SIDRENA-Desktop", "BAZNA-Desktop")
          )
          (folder / "BAZNA-Desktop-release-info.json").write_text(
              json.dumps(info, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          old_manifest.unlink()
          assert len(list(folder.iterdir())) == 17, "Expected 17 BAZNA release files"
          assert all(not path.name.startswith("SIDRENA-") for path in folder.iterdir())
          print("PASS: BAZNA public Windows executable filenames, original binary hashes retained")
          PY
          (cd release && sha256sum -c BAZNA-Desktop-win-x64-SHA256SUMS.txt)
      - name: Create new BAZNA GitHub release
        if: env.ALREADY_EXISTS != '1'
        shell: bash
        run: |
          set -euo pipefail
          wp_sha=$(sha256sum "release/BAZNA-WordPress-$WORDPRESS_VERSION.zip" | cut -d' ' -f1)
          cat > notes.md <<EOF
          # BAZNA $RELEASE_VERSION

          Android $ANDROID_VERSION · Windows $WINDOWS_VERSION · WordPress $WORDPRESS_VERSION

          ## Android
          Nativni Android prikaz s dvanaest povezanih zaslona, hrvatskim jezikom, pretraživanjem, poslovnicama, javnim proizvodima, uslugama i arhivom. Dostupni su instalacijski **debug APK** i **nepotpisani AAB**. Potpisivanje za Google Play nije uključeno.

          ## Windows
          Portable.exe i Setup.exe iz uspješnog CI postupka za isti commit, s provjerenim SHA-256 zbrojevima. Poboljšan vizualni identitet, ujednačeno prikazivanje verzija i kontrole kvalitete.

          ## WordPress
          **BAZNA — Bazne cijene $WORDPRESS_VERSION** — zajednički REST v1 katalog s provjerom objave CSV cjenika, opcionalnim slikama proizvoda i usklađenim BAZNA brendingom. Pravni profil NN 101/2026 i NN 110/2026 ostaje sačuvan. SHA-256: $wp_sha.

          ## Web, Joomla i Shopify $WEB_JOOMLA_SHOPIFY_VERSION (razvojni kandidati)
          Tri nova ZIP paketa: samostalni BAZNA PHP Web, instalacijski Joomla dodatak i Shopify adapter. Web i Joomla dijele responzivne kataloge proizvoda, usluga i poslovnica, uz provjere povijesnih cijena, atomsko uređivanje i arhivu. Shopify dodaje HMAC autentikaciju proxyja, autorizirane kataloge i GDPR privacy webhooks.
          **Shopify adapter nije odobrena App Store aplikacija**: puni OAuth, Billing, embedded UI i trgovinski integracijski testovi još su obvezni. Joomla također zahtijeva test na stvarnoj CMS instalaciji. Uspješne Chrome snimke dokazuju responzivnost, ne 0% pixel-diff prema izvornim referencama.

          ## Licencni servis
          ZIP **BAZNA-Licenca-Server-$RELEASE_VERSION.zip** sadrži sav PHP/JSON kod, Apache/Nginx pravila, testove i upute za https://licenca.brendigo.com/licenca/api.php.
          **Zbog sigurnosti ne sadrži privatni master secret.** Prije prve aktivacije treba dodati isti privatni config.php kojim je izdano postojećih 10.000 ključeva. API vraća 503 dok konfiguracija nije valjana. Ne objavljivati master ključ niti privatni popis ključeva u GitHub izdanju.

          ## Hrvatska pravila
          Proširene obveze počinju 17. studenoga 2026.; referentni datumi su 2. svibnja 2025. i 10. rujna 2026. (NN 101/2026 i NN 110/2026).
          Nacrti pravilnika iz listopada nisu automatski konačni propisi.

          Izvor: https://github.com/$GH_REPO/commit/$CI_SHA

          Android i Windows preuzimaju javni WordPress pravni profil. Administratorsko dvosmjerno uređivanje nije dostupno bez zaštićenog API-ja.
          EOF
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GH_REPO" --target "$CI_SHA" \
            --title "BAZNA" \
            --notes-file notes.md --prerelease
          count=$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets --jq '.assets | length')
          [[ "$count" -eq 17 ]] || { echo "Expected 17 assets, got $count"; exit 1; }
          echo "Published $RELEASE_TAG with $count verified assets."
