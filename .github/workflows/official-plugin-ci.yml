name: BAZNA WordPress plugin checks
on:
  pull_request:
    paths:
      - 'wordpress/brendigo-sidrena-cijena/**'
      - 'licenca/**'
      - 'tools/test_bazna_license_domain.php'
      - 'tools/package_plugin.py'
      - 'tools/package_wporg.py'
      - 'tools/package_license.py'
      - 'tools/test_legal_contract.php'
      - 'tools/test_public_api_contract.php'
      - 'tools/test_public_feed_columns.php'
      - 'tools/test_public_catalog_markup.php'
      - 'tools/test_legal_price_safety.php'
      - 'tools/test_responsive_browser.mjs'
      - 'tools/audit_public_bazna.py'
      - 'tools/fixtures/**'
      - '.github/workflows/official-plugin-ci.yml'
  # Unified releases need a WordPress verdict for the SAME commit, even when
  # only README, Android, licensing or release workflows changed.
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate WordPress version and legal contract
        run: |
          test -f wordpress/brendigo-sidrena-cijena/brendigo-sidrena-cijena.php
          test -f wordpress/brendigo-sidrena-cijena/includes/class-legal.php
          grep -q 'Stable tag: 1.5.16' wordpress/brendigo-sidrena-cijena/readme.txt
      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/brendigo-sidrena-cijena -name '*.php' -type f -print0 |
            xargs -0 -n 1 php -l > /tmp/sidrena-lint.log
          tail -n 3 /tmp/sidrena-lint.log
      - name: Test shared legal contract and legacy-safe BAZNA branding
        run: |
          php tools/test_legal_contract.php
          php tools/test_bazna_brand.php
      - name: Test public Android/WordPress feed discovery compatibility
        run: php tools/test_public_api_contract.php
      - name: Verify BAZNA licence domain binding and server JSON engine
        shell: bash
        run: |
          set -euo pipefail
          php tools/test_bazna_license_domain.php
          php licenca/tests/test.php
          preflight=$(php licenca/bin/preflight.php "$PWD" 2>&1) && {
            echo "Unconfigured licensing preflight unexpectedly succeeded"; exit 1;
          }
          [[ "$preflight" == *"Nedostaje private/config.php"* ]] || {
            echo "Preflight missing a clear configuration failure"; exit 1;
          }
          output=$(php -r '$_SERVER["HTTPS"]="on";$_SERVER["REQUEST_METHOD"]="GET";require "licenca/api.php";')
          [[ "$output" == *'"code":"server_not_provisioned"'* ]] || {
            echo "API without a private master key MUST reject ready status"; exit 1;
          }
          find licenca -name '*.php' -type f -print0 | xargs -0 -n 1 php -l >/tmp/bazna-license-lint.log
          tail -n 4 /tmp/bazna-license-lint.log
      - name: Test optional product imagery and CSV field compatibility
        run: php tools/test_public_feed_columns.php
      - name: Test public mobile service cards and HTML escaping
        run: php tools/test_public_catalog_markup.php
      - name: Test legally verified reference dates and no historical price inference
        run: php tools/test_legal_price_safety.php
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Render real public PHP cjenik and audit WordPress responsive layout in Chrome
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          mkdir -p artifacts/browser-responsive
          php tools/test_public_catalog_markup.php --fixture > artifacts/browser-responsive/public.html
          for attempt in 1 2 3; do
            if node tools/test_responsive_browser.mjs \
              artifacts/browser-responsive/public.html \
              tools/fixtures/admin-responsive.html \
              artifacts/browser-responsive; then
              break
            fi
            [[ "$attempt" -lt 3 ]] || { echo "Chrome rendering failed after three real runs"; exit 1; }
            echo "Chrome runner startup issue; retrying real browser check ($attempt/3)"
            sleep 3
          done
      - name: Upload browser viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BAZNA-WordPress-responsive-Chrome
          path: artifacts/browser-responsive/
          retention-days: 7
          if-no-files-found: warn
      - name: Package reproducibly and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_plugin.py --version 1.5.16 --output artifacts/brendigo-sidrena-cijena-1.5.16.zip
          (cd artifacts && sha256sum -c brendigo-sidrena-cijena-1.5.16.zip.sha256)
          python3 tools/package_plugin.py --version 1.5.16 --output /tmp/sidrena-check/brendigo-sidrena-cijena-1.5.16.zip
          cmp artifacts/brendigo-sidrena-cijena-1.5.16.zip /tmp/sidrena-check/brendigo-sidrena-cijena-1.5.16.zip
      - name: Verify separate fully unlocked WordPress.org candidate package
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_wporg.py --version 1.5.16 --output artifacts/BAZNA-WordPress-org-1.5.16.zip
          (cd artifacts && sha256sum -c BAZNA-WordPress-org-1.5.16.zip.sha256)
          python3 tools/package_wporg.py --version 1.5.16 --output /tmp/bazna-wporg/BAZNA-WordPress-org-1.5.16.zip
          cmp artifacts/BAZNA-WordPress-org-1.5.16.zip /tmp/bazna-wporg/BAZNA-WordPress-org-1.5.16.zip
          mkdir -p /tmp/bazna-wporg/extracted
          unzip -q artifacts/BAZNA-WordPress-org-1.5.16.zip -d /tmp/bazna-wporg/extracted
          find /tmp/bazna-wporg/extracted/bazna-cjenici -name '*.php' -type f -print0 | xargs -0 -n 1 php -l >/tmp/bazna-wporg-lint.log
          grep -q 'Text Domain: bazna-cjenici' /tmp/bazna-wporg/extracted/bazna-cjenici/bazna-cjenici.php
          grep -q 'return true;' /tmp/bazna-wporg/extracted/bazna-cjenici/includes/class-license.php
          if grep -R 'licenca.brendigo.com' /tmp/bazna-wporg/extracted/bazna-cjenici --include='*.php'; then
            echo "ERROR: WordPress.org distribution unexpectedly contains a license API call"
            exit 1
          fi
          echo "PASS: separately packaged GPL WordPress.org candidate, no license lock"
      - name: Upload WordPress.org review candidate
        uses: actions/upload-artifact@v4
        with:
          name: BAZNA-WordPress-org-candidate
          path: |
            artifacts/BAZNA-WordPress-org-1.5.16.zip
            artifacts/BAZNA-WordPress-org-1.5.16.zip.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Package standalone BAZNA JSON license server reproducibly without secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_license.py --version 1.5.16 --output artifacts/BAZNA-Licenca-Server-1.5.16.zip
          python3 tools/package_license.py --version 1.5.16 --output /tmp/sidrena-check/BAZNA-Licenca-Server-1.5.16.zip
          cmp artifacts/BAZNA-Licenca-Server-1.5.16.zip /tmp/sidrena-check/BAZNA-Licenca-Server-1.5.16.zip
          (cd artifacts && sha256sum -c BAZNA-Licenca-Server-1.5.16.zip.sha256)
          python3 - <<'PY'
          import zipfile
          path = 'artifacts/BAZNA-Licenca-Server-1.5.16.zip'
          with zipfile.ZipFile(path) as archive:
              files = archive.namelist()
              assert 'licenca/api.php' in files and 'licenca/lib.php' in files
              assert 'licenca/private/config.php' not in files
              assert not any(x.endswith(('.json', '.lock')) for x in files)
              assert all(x.startswith('licenca/') for x in files)
          print('PASS: portable BAZNA server ZIP and no embedded credentials')
          PY
