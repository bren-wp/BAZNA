name: BAZNA WordPress plugin checks
on:
  pull_request:
    paths:
      - 'wordpress/brendigo-sidrena-cijena/**'
      - 'licenca/**'
      - 'tools/test_bazna_license_domain.php'
      - 'tools/package_plugin.py'
      - 'tools/package_license.py'
      - 'tools/test_legal_contract.php'
      - 'tools/test_public_api_contract.php'
      - 'tools/test_public_feed_columns.php'
      - 'tools/test_public_catalog_markup.php'
      - 'tools/test_legal_price_safety.php'
      - 'tools/test_responsive_browser.mjs'
      - 'tools/fixtures/**'
      - '.github/workflows/official-plugin-ci.yml'
  push:
    branches: [main]
    paths:
      - 'wordpress/brendigo-sidrena-cijena/**'
      - 'licenca/**'
      - 'tools/test_bazna_license_domain.php'
      - 'tools/package_plugin.py'
      - 'tools/package_license.py'
      - 'tools/test_legal_contract.php'
      - 'tools/test_public_api_contract.php'
      - 'tools/test_public_feed_columns.php'
      - 'tools/test_public_catalog_markup.php'
      - 'tools/test_legal_price_safety.php'
      - 'tools/test_responsive_browser.mjs'
      - 'tools/fixtures/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate WordPress version and legal contract
        run: |
          test -f wordpress/brendigo-sidrena-cijena/brendigo-sidrena-cijena.php
          test -f wordpress/brendigo-sidrena-cijena/includes/class-legal.php
          grep -q 'Stable tag: 1.5.12' wordpress/brendigo-sidrena-cijena/readme.txt
      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/brendigo-sidrena-cijena -name '*.php' -type f -print0 |
            xargs -0 -n 1 php -l > /tmp/sidrena-lint.log
          tail -n 3 /tmp/sidrena-lint.log
      - name: Test shared legal contract
        run: php tools/test_legal_contract.php
      - name: Test public Android/WordPress feed discovery compatibility
        run: php tools/test_public_api_contract.php
      - name: Verify BAZNA licence domain binding and server JSON engine
        shell: bash
        run: |
          set -euo pipefail
          php tools/test_bazna_license_domain.php
          php licenca/tests/test.php
          output=$(php -r '$_SERVER["HTTPS"]="on";$_SERVER["REQUEST_METHOD"]="GET";require "licenca/api.php";')
          [[ "$output" == *'"code":"server_not_provisioned"'* ]] || {
            echo "API without a private master key MUST reject ready status"; exit 1;
          }
          find licenca -name '*.php' -type f -print0 | xargs -0 -n 1 php -l >/tmp/bazna-license-lint.log
          tail -n 4 /tmp/bazna-license-lint.log
      - name: Test optional product imagery and CSV field compatibility
        run: php tools/test_public_feed_columns.php
      - name: Test public mobile service cards and HTML escaping
        run: php tools/test_public_catalog_markup.php
      - name: Test legally verified reference dates and no historical price inference
        run: php tools/test_legal_price_safety.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render real public PHP cjenik and audit WordPress responsive layout in Chrome
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          mkdir -p artifacts/browser-responsive
          php tools/test_public_catalog_markup.php --fixture > artifacts/browser-responsive/public.html
          for attempt in 1 2 3; do
            if node tools/test_responsive_browser.mjs \
              artifacts/browser-responsive/public.html \
              tools/fixtures/admin-responsive.html \
              artifacts/browser-responsive; then
              break
            fi
            [[ "$attempt" -lt 3 ]] || { echo "Chrome rendering failed after three real runs"; exit 1; }
            echo "Chrome runner startup issue; retrying real browser check ($attempt/3)"
            sleep 3
          done
      - name: Upload browser viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIDRENA-WordPress-responsive-Chrome
          path: artifacts/browser-responsive/
          retention-days: 7
          if-no-files-found: warn
      - name: Package reproducibly and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_plugin.py --version 1.5.12 --output artifacts/brendigo-sidrena-cijena-1.5.12.zip
          (cd artifacts && sha256sum -c brendigo-sidrena-cijena-1.5.12.zip.sha256)
          python3 tools/package_plugin.py --version 1.5.12 --output /tmp/sidrena-check/brendigo-sidrena-cijena-1.5.12.zip
          cmp artifacts/brendigo-sidrena-cijena-1.5.12.zip /tmp/sidrena-check/brendigo-sidrena-cijena-1.5.12.zip
      - name: Package standalone BAZNA JSON license server reproducibly without secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_license.py --version 1.5.12 --output artifacts/BAZNA-Licenca-Server-1.5.12.zip
          python3 tools/package_license.py --version 1.5.12 --output /tmp/sidrena-check/BAZNA-Licenca-Server-1.5.12.zip
          cmp artifacts/BAZNA-Licenca-Server-1.5.12.zip /tmp/sidrena-check/BAZNA-Licenca-Server-1.5.12.zip
          (cd artifacts && sha256sum -c BAZNA-Licenca-Server-1.5.12.zip.sha256)
          python3 - <<'PY'
          import zipfile
          path = 'artifacts/BAZNA-Licenca-Server-1.5.12.zip'
          with zipfile.ZipFile(path) as archive:
              files = archive.namelist()
              assert 'licenca/api.php' in files and 'licenca/lib.php' in files
              assert 'licenca/private/config.php' not in files
              assert not any(x.endswith(('.json', '.lock')) for x in files)
              assert all(x.startswith('licenca/') for x in files)
          print('PASS: portable BAZNA server ZIP and no embedded credentials')
          PY
