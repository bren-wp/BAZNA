name: BAZNA WordPress plugin checks
on:
  pull_request:
    paths:
      - 'wordpress/brendigo-sidrena-cijena/**'
      - 'tools/package_plugin.py'
      - 'tools/package_wporg.py'
      - 'tools/test_wporg_update_contract.py'
      - '.github/workflows/deploy-wordpress-org.yml'
      - 'tools/test_legal_contract.php'
      - 'tools/test_official_feed.php'
      - 'tools/test_public_api_contract.php'
      - 'tools/test_public_feed_columns.php'
      - 'tools/test_public_catalog_markup.php'
      - 'tools/test_public_embed.php'
      - 'tools/test_public_archive.php'
      - 'tools/test_official_retention.php'
      - 'tools/test_sync_draft.php'
      - 'tools/test_legal_price_safety.php'
      - 'tools/test_responsive_browser.mjs'
      - 'tools/audit_public_bazna.py'
      - 'tools/fixtures/**'
      - '.github/workflows/official-plugin-ci.yml'
  # Unified releases need a WordPress verdict for the SAME commit, even when
  # only README, Android or release workflows changed.
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate WordPress version and legal contract
        run: |
          test -f wordpress/brendigo-sidrena-cijena/brendigo-sidrena-cijena.php
          test -f wordpress/brendigo-sidrena-cijena/includes/class-legal.php
          grep -q 'Stable tag: 1.5.24' wordpress/brendigo-sidrena-cijena/readme.txt
      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/brendigo-sidrena-cijena -name '*.php' -type f -print0 |
            xargs -0 -n 1 php -l > /tmp/sidrena-lint.log
          tail -n 3 /tmp/sidrena-lint.log
      - name: Test shared legal contract and legacy-safe BAZNA branding
        run: |
          php tools/test_legal_contract.php
          php tools/test_official_feed.php
          php tools/test_bazna_brand.php
      - name: Test public Android/WordPress feed discovery compatibility
        run: php tools/test_public_api_contract.php
      - name: Verify original GPL attribution and license-free review readiness
        run: python3 tools/test_wporg_readiness.py
      - name: Verify native WordPress.org update-in-place and ZIP identity
        run: python3 tools/test_wporg_update_contract.py
      - name: Test optional product imagery and CSV field compatibility
        run: php tools/test_public_feed_columns.php
      - name: Test public mobile service cards and HTML escaping
        run: php tools/test_public_catalog_markup.php
      - name: Verify public embeds and custom appearance without fake official links
        run: |
          php tools/test_public_embed.php
          php tools/test_public_archive.php
          php tools/test_official_retention.php
          php tools/test_sync_draft.php
      - name: Test legally verified reference dates and no historical price inference
        run: php tools/test_legal_price_safety.php
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Render real public PHP cjenik and audit WordPress responsive layout in Chrome
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          mkdir -p artifacts/browser-responsive
          php tools/test_public_catalog_markup.php --fixture > artifacts/browser-responsive/public.html
          for attempt in 1 2 3; do
            if node tools/test_responsive_browser.mjs \
              artifacts/browser-responsive/public.html \
              tools/fixtures/admin-responsive.html \
              artifacts/browser-responsive; then
              break
            fi
            [[ "$attempt" -lt 3 ]] || { echo "Chrome rendering failed after three real runs"; exit 1; }
            echo "Chrome runner startup issue; retrying real browser check ($attempt/3)"
            sleep 3
          done
      - name: Upload browser viewport evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BAZNA-WordPress-responsive-Chrome
          path: artifacts/browser-responsive/
          retention-days: 7
          if-no-files-found: warn
      - name: Package reproducibly and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_plugin.py --version 1.5.24 --output artifacts/brendigo-sidrena-cijena-1.5.24.zip
          (cd artifacts && sha256sum -c brendigo-sidrena-cijena-1.5.24.zip.sha256)
          python3 tools/package_plugin.py --version 1.5.24 --output /tmp/sidrena-check/brendigo-sidrena-cijena-1.5.24.zip
          cmp artifacts/brendigo-sidrena-cijena-1.5.24.zip /tmp/sidrena-check/brendigo-sidrena-cijena-1.5.24.zip
      - name: Verify WordPress.org package is a direct in-place update
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/package_wporg.py --version 1.5.24 --output artifacts/BAZNA-WordPress-org-1.5.24.zip
          (cd artifacts && sha256sum -c BAZNA-WordPress-org-1.5.24.zip.sha256)
          cmp artifacts/brendigo-sidrena-cijena-1.5.24.zip artifacts/BAZNA-WordPress-org-1.5.24.zip
          mkdir -p /tmp/bazna-wporg/extracted
          unzip -q artifacts/BAZNA-WordPress-org-1.5.24.zip -d /tmp/bazna-wporg/extracted
          find /tmp/bazna-wporg/extracted/brendigo-sidrena-cijena -name '*.php' -type f -print0 | xargs -0 -n 1 php -l >/tmp/bazna-wporg-lint.log
          grep -q 'Text Domain: brendigo-sidrena-cijena' /tmp/bazna-wporg/extracted/brendigo-sidrena-cijena/brendigo-sidrena-cijena.php
          test ! -e /tmp/bazna-wporg/extracted/brendigo-sidrena-cijena/includes/class-license.php
          if grep -R 'licenca.brendigo.com' /tmp/bazna-wporg/extracted/brendigo-sidrena-cijena --include='*.php'; then
            echo "ERROR: WordPress.org distribution unexpectedly contains a license API call"
            exit 1
          fi
          echo "PASS: WordPress.org candidate matches the installable original-slug ZIP byte for byte"
      - name: Upload WordPress.org existing-slug update candidate
        uses: actions/upload-artifact@v7
        with:
          name: BAZNA-WordPress-org-candidate
          path: |
            artifacts/BAZNA-WordPress-org-1.5.24.zip
            artifacts/BAZNA-WordPress-org-1.5.24.zip.sha256
          retention-days: 7
          if-no-files-found: error

  php74-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install declared minimum WordPress PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      - name: Lint entire installable WordPress plugin on PHP 7.4
        shell: bash
        run: |
          set -euo pipefail
          php -r 'if (PHP_MAJOR_VERSION !== 7 || PHP_MINOR_VERSION !== 4) { exit(1); }'
          find wordpress/brendigo-sidrena-cijena -type f -name '*.php' -print0 |
            xargs -0 -n 1 php -l > /tmp/bazna-min-php.log
          php tools/test_official_retention.php
          echo 'PASS: WordPress 7.4 minimum syntax and official archive hold test'
